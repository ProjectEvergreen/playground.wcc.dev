<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WCC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta property="og:title" content="WCC" />
    <meta
      name="description"
      content="WCC supports server-rendering of web standard Web Components; generating HTML directly from your custom element definitions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.wcc.dev" />
    <meta property="og:image" content="https://www.wcc.dev/assets/wcc-logo-og.png" />
    <meta
      property="og:description"
      content="WCC supports server-rendering of web standard Web Components; generating HTML directly from your custom element definitions."
    />
    <meta name="twitter:site" content="@PrjEvergreen" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="/node_modules/monaco-editor/min/vs/editor/editor.main.css" />

    <script type="module" src="./scripts/repl-init.ts " defer></script>
    <script type="module" src="./components/header/header.tsx" data-gwd-opt="static"></script>
    <script type="module" src="./components/footer/footer.tsx" data-gwd-opt="static"></script>

    <style>
      #playground-container {
        display: flex;
        gap: 2%;
        width: 100%;
        height: 80vh;
      }

      #input-container,
      #output-container {
        flex: 1;
        width: 100%;
      }

      #input-content,
      #output-content {
        width: 100%;
        height: 100%;
      }

      /* https://stackoverflow.com/a/71876526/417806 */
      .monaco-editor {
        position: absolute !important;
        padding: var(--size-2);
      }
    </style>
  </head>
  <body>
    <wcc-header></wcc-header>

    <div id="playground-container">
      <div id="input-container">
        <h2>Input</h2>
        <select id="input-language">
          <option value="js">JavaScript</option>
          <option value="ts">TypeScript</option>
          <option value="jsx">JSX</option>
          <option value="tsx">TSX</option>
        </select>
        <div id="input-content"></div>
      </div>

      <div id="output-container">
        <h2>Output</h2>
        <div id="output-content"></div>
      </div>
    </div>

    <wcc-footer></wcc-footer>
  </body>
</html>
